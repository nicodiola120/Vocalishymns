<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Choralis</title>
    <style>
      html, body, #root {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: none;
      }
      #splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        background: radial-gradient(circle at 0% 0%, #141526 0%, #030408 100%);
        color: #e2e8f0;
        font-family: 'Segoe UI', system-ui, sans-serif;
        gap: 16px;
      }
      #splash h1 {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: 2px;
        background: linear-gradient(to right, #f1f5f9, #93c5fd, #bfdbfe);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin: 0;
      }
      #splash .spinner {
        width: 24px;
        height: 24px;
        border: 2px solid rgba(255,255,255,0.1);
        border-top-color: #60a5fa;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #splash .sub {
        font-size: 11px;
        color: #64748b;
        letter-spacing: 1px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="splash">
        <h1>CHORALIS</h1>
        <div class="sub">Choir Voice Mixer</div>
        <div class="spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
